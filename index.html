 const st=()=>({n:$("nm").value.trim()||"?",x:+me.x.toFixed(2),z:+me.z.toFixed(2),ry:+me.ry.toFixed(2),y:+me.y.toFixed(2),h:hit,e:em});
 const apply=(all,myid)=>{peers=Object.keys(all).map(k=>({peer:k,isMe:k===myid,presence:all[k]}));syncOthers();render()};
 const p=new Peer(hid);
 p.on("open",()=>{Net.id="host";const conns=[],pl={},G={s:"wait",r:0,end:0};
  Net.start=()=>{if(G.s==="count")return;G.r++;G.s="count";G.end=Date.now()+3000};
  p.on("connection",c=>{conns.push(c);
   c.on("data",d=>{if(d&&d.t==="s"){const o=pl[c.peer]||{};pl[c.peer]={n:String(d.n).slice(0,14),x:+d.x||0,z:+d.z||0,ry:+d.ry||0,y:+d.y||0,h:(d.h&&typeof d.h==="object")?{t:String(d.h.t||""),n:+d.h.n||0}:{t:"",n:0},e:(d.e&&typeof d.e==="object")?{k:Math.max(0,Math.min(4,d.e.k|0)),n:+d.e.n||0}:{k:0,n:0},f:(d.f&&typeof d.f==="object")?d.f:(o.f||{})}}});
   c.on("close",()=>{delete pl[c.peer];const k=conns.indexOf(c);if(k>=0)conns.splice(k,1)})});
  Net.tick=()=>{if(G.s==="count"&&Date.now()>=G.end)G.s="play";
   const g={s:G.s,c:G.s==="count"?Math.max(1,Math.ceil((G.end-Date.now())/1000)):0,r:G.r};setGame(g);
   pl.host=Object.assign(st(),{f:mine});const all=Object.assign({},pl);conns.forEach(c=>{if(c.open)c.send({t:"all",p:all,g})});apply(all,"host")}});
 p.on("error",e=>{
  if(e.type!=="unavailable-id")return off();
  const q=new Peer();q.on("error",off);
  q.on("open",id=>{Net.id=id;const c=q.connect(hid,{reliable:true});
   c.on("open",()=>{Net.dirty=1;Net.tick=()=>{const m=Object.assign({t:"s"},st());if(Net.dirty){m.f=mine;Net.dirty=0}c.send(m)}});
   c.on("data",d=>{if(d&&d.t==="all"){const g=d.g;if(g&&typeof g==="object"&&["wait","count","play"].includes(g.s))setGame({s:g.s,c:+g.c||0,r:+g.r||0});apply(d.p,id)}});
   c.on("close",()=>{Net.tick=()=>{};off()})})})}
$("join").onclick=()=>{
 code=($("code").value.replace(/\W/g,"")||"6752").toLowerCase();mine={};peers=[];
 try{localStorage.setItem("bhname",$("nm").value.trim());localStorage.setItem("bhcode",code)}catch(e){}
 document.body.classList.add("play");
 $("lobby").style.display="none";$("bgm").volume=.5;$("bgm").play().catch(()=>{});build();started=true;render();
 try{startNet()}catch(e){$("top").innerHTML+="<br>"+T[L].off;game={s:"play",c:0,r:0}}
};
$("mute").onclick=()=>{const a=$("bgm");a.muted=!a.muted;$("mute").textContent=a.muted?"🔇":"🔊";if(!a.muted)a.play().catch(()=>{})};
setInterval(()=>{Net.tick();uiGame()},100);
function menu(force){const p=$("pause"),on=force===undefined?p.style.display!=="flex":force;p.style.display=on?"flex":"none"}
$("bm").onclick=()=>menu(true);$("resume").onclick=()=>menu(false);$("leave").onclick=()=>location.reload();
$("sndb").onclick=()=>{$("mute").click();tx()};
{const c0=code;code="6752";build();code=c0}/* декорации для фона меню */
tx();
</script></body></html>
