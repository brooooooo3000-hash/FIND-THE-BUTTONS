<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Button Hunt 3D</title>
<style>
:root{--bg:#15171c;--fg:#f2f2f2;--card:#000a;--ac:#ff922b;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
*{box-sizing:border-box}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.p{background:var(--card);border-radius:10px;padding:8px 10px;min-width:150px}
.me{color:var(--ac);font-weight:700}
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px;z-index:5}
#lobby>div{max-width:420px;text-align:center}
input,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #8886;background:#2a2d36;color:var(--fg)}
button.go{background:var(--ac);color:#000;border:0;font-weight:700;cursor:pointer}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#000;font-weight:700;border:0;display:none;z-index:3}
#hint2{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.7;pointer-events:none}
.lang{margin-top:12px}.lang button{padding:4px 10px;margin:0 2px}
</style></head><body>
<div id="lobby"><div>
<h1 id="t"></h1><p id="hint" style="opacity:.8"></p>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><input id="nm" maxlength="14" size="12"><input id="code" inputmode="numeric" maxlength="8" size="7" value="6752"><button class="go" id="join"></button></div>
<div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="ko">한국어</button></div>
</div></div>
<canvas id="c"></canvas>
<div id="hud"><div class="p" id="top"></div><div class="p" id="board"></div></div>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio><button id="mute" style="position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;padding:6px 10px">🔊</button><button id="act"></button><div id="hint2"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const T={ru:{t:"🔘 Охота за кнопками 3D",nm:"Ваше имя",join:"Войти",hint:"Код комнаты (6752, 6753…) — у каждого кода своя комната и своя карта. Ходите и жмите кнопки: кто найдёт больше из 100 — тот победил!",room:"Комната",left:"Осталось",act:"НАЖАТЬ (E)",c:"WASD — ходьба, мышь/палец — осмотр, E — нажать",over:"Все 100 найдены! Победитель: ",you:"вы",off:"Мультиплеер недоступен — игра одна"},
en:{t:"🔘 Button Hunt 3D",nm:"Your name",join:"Join",hint:"Room code (6752, 6753…) — each code is its own room and map. Walk around and press buttons: most of 100 wins!",room:"Room",left:"Left",act:"PRESS (E)",c:"WASD move, mouse/touch look, E press",over:"All 100 found! Winner: ",you:"you",off:"Multiplayer unavailable — solo"},
ko:{t:"🔘 버튼 찾기 3D",nm:"이름",join:"입장",hint:"방 코드(6752, 6753…) — 코드마다 별도의 방과 지도. 걸어 다니며 버튼을 누르세요. 100개 중 가장 많이 찾은 사람이 승리!",room:"방",left:"남은 버튼",act:"누르기 (E)",c:"WASD 이동, 마우스/터치 시점, E 누르기",over:"100개 모두 발견! 승자: ",you:"나",off:"멀티플레이 불가 — 혼자 플레이"}};
let L=(navigator.language||"").startsWith("ko")?"ko":(navigator.language||"").startsWith("en")?"en":"ru";
const $=i=>document.getElementById(i);
function tx(){const s=T[L];$("t").textContent=s.t;$("nm").placeholder=s.nm;$("join").textContent=s.join;$("hint").textContent=s.hint;$("act").textContent=s.act;$("hint2").textContent=s.c;render()}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;tx()});
$("nm").value="P"+Math.floor(100+Math.random()*900);
function rng(seed){let a=seed>>>0||1;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
const R=40;let code="",room=null,mine={},peers=[],btns=[],others={},started=false,lastSend=0,solo=false;
const me={x:0,z:0,ry:0,pitch:0};
const scene=new THREE.Scene();const SKY=0x8ec5ff;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,20,70);
const cam=new THREE.PerspectiveCamera(75,1,.1,100);cam.rotation.order="YXZ";
const ren=new THREE.WebGLRenderer({canvas:$("c"),antialias:true});
const hemi=new THREE.HemisphereLight(0xbfd4ff,0x333344,1.1);scene.add(hemi);
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(10,20,5);scene.add(dl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(R*2+20,R*2+20),new THREE.MeshLambertMaterial({color:0x4f8f3a}));const W=new THREE.Group();scene.add(W);ground.rotation.x=-Math.PI/2;W.add(ground);
const wallM=new THREE.MeshLambertMaterial({color:0x555b6e});
[[0,-R-5,R*2+10,1],[0,R+5,R*2+10,1],[-R-5,0,1,R*2+10],[R+5,0,1,R*2+10]].forEach(([x,z,w,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,4,d),wallM);m.position.set(x,2,z);W.add(m)});
const pillars=[];
function build(){
 btns.forEach(b=>W.remove(b.g));pillars.forEach(p=>W.remove(p));trees.length=0;btns=[];pillars.length=0;
 const r=rng(hash("btn"+code));
 for(let i=0;i<40;i++){const h=2+r()*5,m=new THREE.Mesh(new THREE.BoxGeometry(1.5+r()*3,h,1.5+r()*3),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(r(),.2,.4)}));m.position.set((r()-.5)*R*2,h/2,(r()-.5)*R*2);W.add(m);pillars.push(m)}
 for(let i=0;i<100;i++){
  const g=new THREE.Group(),base=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.3,16),new THREE.MeshLambertMaterial({color:0x777777}));base.position.y=.15;
  const top=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.15,16),new THREE.MeshLambertMaterial({color:0xff3b30,emissive:0x660000}));top.position.y=.37;
  g.add(base,top);g.position.set((r()-.5)*(R*2-4),0,(r()-.5)*(R*2-4));W.add(g);btns.push({g,top,i})}
 if(D)W.remove(D);D=new THREE.Group();W.add(D);
 const rr=rng(hash("nat"+code)),far=()=>{let x,z;do{x=(rr()-.5)*R*2.1;z=(rr()-.5)*R*2.1}while(Math.hypot(x,z)<3);return[x,z]};
 const trM=new THREE.MeshLambertMaterial({color:0x6b4a2b}),lfM=[0x2e7d32,0x388e3c,0x1b5e20].map(c=>new THREE.MeshLambertMaterial({color:c}));
 for(let i=0;i<110;i++){const[x,z]=far(),h=1.5+rr()*2,g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,h,7),trM);t.position.y=h/2;g.add(t);
  for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.ConeGeometry(1.5-k*.35,1.6,8),lfM[i%3]);c.position.y=h+k*.9-.2;g.add(c)}
  g.position.set(x,0,z);D.add(g);trees.push([x,z])}
 for(let i=0;i<70;i++){const[x,z]=far(),b=new THREE.Mesh(new THREE.SphereGeometry(.4+rr()*.4,8,6),lfM[i%3]);b.position.set(x,.3,z);b.scale.y=.7;D.add(b)}
 for(let i=0;i<40;i++){const[x,z]=far(),k=new THREE.Mesh(new THREE.DodecahedronGeometry(.3+rr()*.6),new THREE.MeshLambertMaterial({color:0x8a8d93}));k.position.set(x,.2,z);k.rotation.set(rr()*3,rr()*3,0);D.add(k)}
 for(let i=0;i<120;i++){const[x,z]=far(),f=new THREE.Mesh(new THREE.SphereGeometry(.08,6,6),new THREE.MeshBasicMaterial({color:[0xffeb3b,0xff4081,0xffffff,0xb388ff][i%4]}));f.position.set(x,.25,z);D.add(f)}
 const gr=new THREE.InstancedMesh(new THREE.ConeGeometry(.07,.55,3),new THREE.MeshLambertMaterial({color:0xffffff}),3500),dm=new THREE.Object3D(),col=new THREE.Color();
 for(let i=0;i<3500;i++){dm.position.set((rr()-.5)*R*2.2,.25,(rr()-.5)*R*2.2);dm.scale.setScalar(.6+rr()*1.2);dm.rotation.set((rr()-.5)*.4,0,(rr()-.5)*.4);dm.updateMatrix();gr.setMatrixAt(i,dm.matrix);gr.setColorAt(i,col.setHSL(.25+rr()*.08,.6,.3+rr()*.15))}
 D.add(gr);
 {const a=Math.random()*6.28;me.x=Math.cos(a)*2;me.z=Math.sin(a)*2}
}
function owners(){
 const m={},all=[{k:"me",n:$("nm").value.trim()||"?",f:mine,me:1}];
 peers.forEach(p=>{if(p.isMe)return;all.push({k:p.peer,n:String(p.presence.n||"?").slice(0,14),f:p.presence.f||{},me:0})});
 all.forEach(a=>{for(const id in a.f){const t=+a.f[id];if(!m[id]||t<m[id].t)m[id]={k:a.k,t}}});return{m,all}}
function render(){
 if(!code)return;const s=T[L],{m,all}=owners(),tot=Object.keys(m).length;
 const sc=all.map(a=>({n:a.n,me:a.me,c:Object.values(m).filter(o=>o.k===a.k).length})).sort((x,y)=>y.c-x.c);
 $("top").innerHTML=`${s.room} <b>${esc(code)}</b><br>${s.left}: ${100-tot}`;
 $("board").innerHTML=sc.slice(0,8).map((x,i)=>`<div class="${x.me?"me":""}">${i+1}. ${esc(x.n)} — ${x.c}</div>`).join("")+(tot>=100?`<div><b>${s.over}${esc(sc[0].n)}</b></div>`:"");
 btns.forEach(b=>{const o=m[b.i];b.top.material.color.setHex(o?(o.k==="me"?0x34c759:0x666666):0xff3b30);b.top.material.emissive.setHex(o?0:0x660000);b.top.position.y=o?.28:.37;b.taken=!!o});
}
function nameSprite(n,hue){const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");x.fillStyle="#000a";x.fillRect(0,0,256,64);x.fillStyle="#fff";x.font="bold 34px sans-serif";x.textAlign="center";x.fillText(n,128,44);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));sp.scale.set(2,.5,1);sp.position.y=2.4;return sp}
function syncOthers(){
 const seen=new Set();
 peers.forEach(p=>{if(p.isMe)return;seen.add(p.peer);const pr=p.presence;let o=others[p.peer];
  if(!o||o.n!==pr.n){if(o)scene.remove(o.m);const hue=hash(p.peer)%360/360,g=new THREE.Group();
   const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.6,12),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(hue,.7,.55)}));body.position.y=.8;
   const head=new THREE.Mesh(new THREE.SphereGeometry(.3,12,12),new THREE.MeshLambertMaterial({color:0xffe0bd}));head.position.y=1.9;
   g.add(body,head,nameSprite(String(pr.n||"?").slice(0,14),hue));scene.add(g);o=others[p.peer]={m:g,n:pr.n,x:0,z:0,ry:0};g.position.set(pr.x||0,0,pr.z||0);o.x=pr.x||0;o.z=pr.z||0}
  o.tx=pr.x||0;o.tz=pr.z||0;o.try=pr.ry||0});
 for(const k in others)if(!seen.has(k)){scene.remove(others[k].m);delete others[k]}
}
let D=null;const trees=[];
const keys={};addEventListener("keydown",e=>{keys[e.code]=1;if(e.code==="KeyE")press()});addEventListener("keyup",e=>keys[e.code]=0);
let joy=null,look=null;const cv=$("c");
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);
 if(e.pointerType==="touch"&&e.clientX<innerWidth/2)joy={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};else look={id:e.pointerId,x:e.clientX,y:e.clientY}});
cv.addEventListener("pointermove",e=>{
 if(joy&&e.pointerId===joy.id){joy.dx=Math.max(-1,Math.min(1,(e.clientX-joy.x)/50));joy.dy=Math.max(-1,Math.min(1,(e.clientY-joy.y)/50))}
 else if(look&&e.pointerId===look.id){me.ry-=(e.clientX-look.x)*.006;me.pitch=Math.max(-1.2,Math.min(1.2,me.pitch-(e.clientY-look.y)*.006));look.x=e.clientX;look.y=e.clientY}});
const up=e=>{if(joy&&e.pointerId===joy.id)joy=null;if(look&&e.pointerId===look.id)look=null};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
function near(){let best=null,bd=2.2;btns.forEach(b=>{if(b.taken)return;const d=Math.hypot(b.g.position.x-me.x,b.g.position.z-me.z);if(d<bd){bd=d;best=b}});return best}
function press(){if(!started)return;const b=near();if(!b||mine[b.i])return;mine[b.i]=Date.now();Net.dirty=1;render()}
$("act").onclick=press;
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
 if(started){
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  if(keys.ArrowLeft)me.ry+=2*dt;if(keys.ArrowRight)me.ry-=2*dt;
  if(joy){f-=joy.dy;s+=joy.dx}
  const sp=6*dt,sn=Math.sin(me.ry),cs=Math.cos(me.ry);
  const ddx=(-sn*f+cs*s)*sp,ddz=(-cs*f-sn*s)*sp;
  me.x=Math.max(-R-2,Math.min(R+2,me.x+ddx));me.z=Math.max(-R-2,Math.min(R+2,me.z+ddz));for(const t of trees){const dx=me.x-t[0],dz=me.z-t[1],d=Math.hypot(dx,dz);if(d<.6&&d>0){me.x=t[0]+dx/d*.6;me.z=t[1]+dz/d*.6}}
  cam.position.set(me.x,1.6,me.z);cam.rotation.set(me.pitch,me.ry,0);
  const nb=near();$("act").style.display=nb&&!mine[nb.i]?"block":"none";
  
  for(const k in others){const o=others[k];if(o.tx===undefined)continue;o.x+=(o.tx-o.x)*Math.min(1,dt*10);o.z+=(o.tz-o.z)*Math.min(1,dt*10);o.m.position.set(o.x,0,o.z);o.m.rotation.y=o.try}
 }
 ren.render(scene,cam)}
requestAnimationFrame(loop);
const Net={dirty:1,tick(){}};
function startNet(){
 const hid="kbh3d-"+code+"-host",off=()=>{$("top").innerHTML+="<br>"+T[L].off};
 const st=()=>({n:$("nm").value.trim()||"?",x:+me.x.toFixed(2),z:+me.z.toFixed(2),ry:+me.ry.toFixed(2)});
 const apply=(all,myid)=>{peers=Object.keys(all).map(k=>({peer:k,isMe:k===myid,presence:all[k]}));syncOthers();render()};
 const p=new Peer(hid);
 p.on("open",()=>{const conns=[],pl={};
  p.on("connection",c=>{conns.push(c);
   c.on("data",d=>{if(d&&d.t==="s"){const o=pl[c.peer]||{};pl[c.peer]={n:String(d.n).slice(0,14),x:+d.x||0,z:+d.z||0,ry:+d.ry||0,f:(d.f&&typeof d.f==="object")?d.f:(o.f||{})}}});
   c.on("close",()=>{delete pl[c.peer];const k=conns.indexOf(c);if(k>=0)conns.splice(k,1)})});
  Net.tick=()=>{pl.host=Object.assign(st(),{f:mine});const all=Object.assign({},pl);conns.forEach(c=>{if(c.open)c.send({t:"all",p:all})});apply(all,"host")}});
 p.on("error",e=>{
  if(e.type!=="unavailable-id")return off();
  const q=new Peer();q.on("error",off);
  q.on("open",id=>{const c=q.connect(hid,{reliable:true});
   c.on("open",()=>{Net.dirty=1;Net.tick=()=>{const m=Object.assign({t:"s"},st());if(Net.dirty){m.f=mine;Net.dirty=0}c.send(m)}});
   c.on("data",d=>{if(d&&d.t==="all")apply(d.p,id)});
   c.on("close",()=>{Net.tick=()=>{};off()})})})}
$("join").onclick=()=>{
 code=($("code").value.replace(/\W/g,"")||"6752").toLowerCase();mine={};peers=[];
 $("lobby").style.display="none";$("bgm").volume=.5;$("bgm").play().catch(()=>{});build();started=true;render();
 try{startNet()}catch(e){$("top").innerHTML+="<br>"+T[L].off}
};
$("mute").onclick=()=>{const a=$("bgm");a.muted=!a.muted;$("mute").textContent=a.muted?"🔇":"🔊";if(!a.muted)a.play().catch(()=>{})};
setInterval(()=>Net.tick(),100);
tx();
</script></body></html>
